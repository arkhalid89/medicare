; MediCare Practice — bundled PHP configuration (portable, offline).
; Paths (extension_dir, session.save_path, error_log, temp) are passed by
; MediCare.exe at start-up so the installation folder can be anywhere.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
memory_limit = 512M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 256M
upload_max_filesize = 256M
max_file_uploads = 20
file_uploads = On
allow_url_fopen = Off
default_charset = "UTF-8"
variables_order = "GPCS"
request_order = "GP"

extension_dir = "ext"
extension = pdo_mysql
extension = mbstring
extension = fileinfo
zend_extension = opcache

[Date]
date.timezone = Asia/Karachi

[Session]
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.gc_maxlifetime = 28800

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

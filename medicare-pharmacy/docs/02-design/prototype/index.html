<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
/* Prototype only. Every colour, size and font comes from tokens.css. Layout: prototype control bar, then the app window (nav | header/content/status). */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--c-canvas);color:var(--c-ink);font-family:var(--f-ui);font-size:var(--t-md);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s-3)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:var(--focus-width) solid var(--c-focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.r{text-align:right}
.muted{color:var(--c-ink-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype controls ---------- */
.proto{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-5);align-items:center;margin:0 auto var(--s-3);max-width:1440px;font-size:var(--t-sm)}
.proto b{font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-muted)}
.proto label{display:flex;gap:var(--s-2);align-items:center}
.proto select,.proto button{background:var(--c-surface);border:var(--border) solid var(--c-line-strong);border-radius:var(--r-md);padding:4px 8px;cursor:pointer}
.proto button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-surface);border-color:var(--c-ink)}
.proto .demo{flex-basis:100%;color:var(--c-ink-muted)}
.proto .demo .code{font-family:var(--f-num);background:var(--c-surface-alt);padding:1px 6px;border-radius:var(--r-sm);color:var(--c-ink);cursor:pointer;border:0}

/* ---------- app window ---------- */
.winwrap{overflow-x:auto;max-width:1440px;margin:0 auto;border:var(--border) solid var(--c-line);border-radius:8px;background:var(--c-surface)}
.app{min-width:1240px;height:800px;display:grid;grid-template-columns:var(--nav-width) 1fr;grid-template-rows:var(--header-h) 1fr var(--status-h);position:relative;background:var(--c-canvas);overflow:hidden}
.app.rail{grid-template-columns:var(--nav-rail) 1fr}
.app.bare{grid-template-columns:1fr;grid-template-rows:1fr}
.nav{grid-row:1/4;background:var(--c-surface);border-right:var(--border) solid var(--c-line);display:flex;flex-direction:column;padding:var(--s-3) var(--s-2);gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:var(--s-2);font-weight:var(--w-bold);font-size:var(--t-lg);color:var(--c-accent);padding:var(--s-1) var(--s-2) var(--s-3)}
.cross{width:22px;height:22px;border-radius:5px;background:var(--c-accent);position:relative;flex:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--c-on-accent);left:50%;top:50%;transform:translate(-50%,-50%)}
.cross::before{width:12px;height:4px}.cross::after{width:4px;height:12px}
.nav .grp{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--c-ink-muted);padding:var(--s-3) var(--s-2) var(--s-1)}
.nav a{display:flex;align-items:center;gap:var(--s-2);padding:6px var(--s-2);border-radius:var(--r-md);color:var(--c-ink-muted);text-decoration:none;font-size:var(--t-md)}
.nav a:hover{background:var(--c-surface-alt);color:var(--c-ink)}
.nav a.on{background:var(--c-select);color:var(--c-accent);font-weight:var(--w-bold)}
.nav .badge{margin-left:auto;font-family:var(--f-num);font-size:var(--t-xs);background:var(--c-warn-bg);color:var(--c-warn);border-radius:999px;padding:0 6px}
.nav .grow{flex:1}
.top{display:flex;align-items:center;gap:var(--s-5);padding:0 var(--s-5);background:var(--c-surface);border-bottom:var(--border) solid var(--c-line)}
.top h1{font-size:var(--t-xl);margin:0}
.kv{display:flex;flex-direction:column;line-height:1.2}
.kv small{font-size:var(--t-xs);color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:.06em}
.kv span{font-weight:var(--w-bold)}
.top .sp{flex:1}
.user{display:flex;align-items:center;gap:var(--s-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--c-surface-alt);display:grid;place-items:center;font-weight:var(--w-bold);font-size:var(--t-sm)}
.main{overflow:auto;padding:var(--s-4) var(--s-5);position:relative;min-height:0}
.app.pos .main{padding:0;display:grid;grid-template-rows:1fr var(--fkey-h)}
.status{grid-column:2;display:flex;align-items:center;gap:var(--s-5);padding:0 var(--s-5);font-size:var(--t-sm);color:var(--c-ink-muted);background:var(--c-surface);border-top:var(--border) solid var(--c-line)}
.status .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c-ok);display:inline-block;margin-right:6px}
.status.down{background:var(--c-danger-bg);color:var(--c-danger);font-weight:var(--w-bold)}
.status.down .dot{background:var(--c-danger)}

/* ---------- primitives ---------- */
.row{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:var(--s-3);align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-4)}
.split{display:grid;grid-template-columns:1fr 360px;gap:var(--s-4);align-items:start}
.panel{background:var(--c-surface);border:var(--border) solid var(--c-line);border-radius:var(--r-md);padding:var(--s-4);display:grid;gap:var(--s-3);align-content:start;min-width:0}
.panel h2{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--c-ink-muted);margin:0}
.panel h3{font-size:var(--t-lg);margin:0}
.btn{height:var(--control-h);padding:0 var(--s-3);border-radius:var(--r-md);border:var(--border) solid var(--c-line-strong);background:var(--c-surface);cursor:pointer;display:inline-flex;align-items:center;gap:var(--s-2);font-weight:var(--w-bold);white-space:nowrap}
.btn:hover{background:var(--c-surface-alt)}
.btn kbd{font-family:var(--f-num);font-size:var(--t-xs);color:var(--c-ink-muted);font-weight:var(--w-regular)}
.btn.pri{background:var(--c-primary-action);color:var(--c-on-primary);border-color:var(--c-primary-action);height:var(--control-h-lg)}
.btn.pri kbd{color:inherit;opacity:.8}
.btn.acc{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.btn.acc:hover{background:var(--c-accent-hover)}
.btn.danger{color:var(--c-danger);border-color:var(--c-danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:var(--t-sm);font-weight:var(--w-bold)}
.field .hint{font-size:var(--t-sm);color:var(--c-ink-muted)}
.field .err{font-size:var(--t-sm);color:var(--c-danger)}
.in{height:var(--control-h);border:var(--border) solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-surface);padding:0 var(--s-2);width:100%}
.in:focus{outline:none;border:2px solid var(--c-focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-focus) 14%,transparent)}
.in.bad{border-color:var(--c-danger)}
.in.n{text-align:right;font-family:var(--f-num)}
select.in{padding-right:var(--s-1)}
.chip{display:inline-flex;align-items:center;font-size:var(--t-xs);font-weight:var(--w-bold);letter-spacing:.04em;padding:1px 6px;border-radius:var(--r-sm);white-space:nowrap;background:var(--c-surface-alt);color:var(--c-ink-muted)}
.chip.ok{background:var(--c-ok-bg);color:var(--c-ok)}.chip.warn{background:var(--c-warn-bg);color:var(--c-warn)}
.chip.danger{background:var(--c-danger-bg);color:var(--c-danger)}.chip.info{background:var(--c-info-bg);color:var(--c-info)}
.chip.acc{background:var(--c-select);color:var(--c-accent)}
.banner{display:flex;gap:var(--s-3);align-items:center;padding:var(--s-2) var(--s-3);border-radius:var(--r-md);font-weight:var(--w-bold)}
.banner.ok{background:var(--c-ok-bg);color:var(--c-ok)}.banner.warn{background:var(--c-warn-bg);color:var(--c-warn)}
.banner.danger{background:var(--c-danger-bg);color:var(--c-danger)}.banner.info{background:var(--c-info-bg);color:var(--c-info)}
.banner .sp{flex:1}
.tabs{display:flex;gap:2px;border-bottom:var(--border) solid var(--c-line)}
.tabs button{border:0;background:transparent;padding:var(--s-2) var(--s-3);cursor:pointer;color:var(--c-ink-muted);border-bottom:2px solid transparent;font-weight:var(--w-bold)}
.tabs button.on{color:var(--c-accent);border-bottom-color:var(--c-accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-3)}
.kpi{background:var(--c-surface);border:var(--border) solid var(--c-line);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);display:grid;gap:2px;min-width:0}
.kpi small{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--c-ink-muted)}
.kpi .v{font-family:var(--f-num);font-size:var(--t-2xl);font-weight:600;line-height:1.2}
.kpi .s{font-size:var(--t-sm);color:var(--c-ink-muted)}
.kpi.warn{border-color:var(--c-warn)}.kpi.danger{border-color:var(--c-danger)}
.empty{display:grid;place-items:center;text-align:center;gap:var(--s-3);padding:var(--s-8);color:var(--c-ink-muted)}
.empty h3{color:var(--c-ink);margin:0;font-size:var(--t-lg)}
.skel{height:14px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--c-surface-alt),var(--c-line),var(--c-surface-alt));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ---------- grid ---------- */
.tbl{background:var(--c-surface);border:var(--border) solid var(--c-line);border-radius:var(--r-md);overflow:auto}
table.g{border-collapse:collapse;width:100%}
table.g th{position:sticky;top:0;background:var(--c-surface-alt);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--c-ink-muted);text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--border) solid var(--c-line);white-space:nowrap}
table.g td{padding:0 var(--s-3);height:var(--row-h);border-bottom:var(--border) solid var(--c-line);white-space:nowrap}
table.g td.wrap{white-space:normal}
table.g tr.sel td{background:var(--c-select)}
table.g tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--c-accent)}
table.g tr.click{cursor:pointer}
table.g tr.click:hover td{background:var(--c-surface-alt)}
table.g th.r,table.g td.r{text-align:right}
table.g tfoot td{font-weight:var(--w-bold);background:var(--c-surface-alt)}
.mn{font-weight:var(--w-bold);font-size:var(--t-lg)}
.ms{font-size:var(--t-sm);color:var(--c-ink-muted)}
.ledger td.neg{color:var(--c-danger)}

/* ---------- POS ---------- */
.posbody{display:grid;grid-template-columns:1fr 336px;gap:var(--s-4);padding:var(--s-4) var(--s-5);min-height:0}
.posleft{display:grid;grid-template-rows:auto auto 1fr;gap:var(--s-3);min-height:0}
.scan{display:flex;align-items:center;gap:var(--s-2);background:var(--c-surface);border:2px solid var(--c-focus);border-radius:var(--r-md);padding:0 var(--s-3);height:48px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c-focus) 12%,transparent)}
.scan input{flex:1;border:0;background:transparent;font-size:16px;outline:none;height:100%}
.scan kbd{font-family:var(--f-num);font-size:var(--t-xs);border:var(--border) solid var(--c-line);border-radius:var(--r-sm);padding:1px 6px;color:var(--c-ink-muted)}
.scanmsg{min-height:22px;font-size:var(--t-sm)}
.posside{display:flex;flex-direction:column;justify-content:space-between;gap:var(--s-2);min-height:0}
.posside .panel{padding:var(--s-3);gap:var(--s-2)}
.insp .rw,.sums .rw{display:flex;justify-content:space-between;font-size:var(--t-md)}
.insp .rw b,.sums .rw span:last-child{font-family:var(--f-num);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--c-surface-alt);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-warn)}
.total{background:var(--c-accent);color:var(--c-on-accent);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);display:grid}
.total small{font-size:var(--t-sm);text-transform:uppercase;letter-spacing:.08em}
.total .amt{font-family:var(--f-num);font-size:var(--t-total);font-weight:600;line-height:1.1}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s-2)}
.acts .btn{justify-content:space-between;padding:0 var(--s-2);font-size:var(--t-sm)}
.acts .btn.pri{grid-column:1/4;font-size:var(--t-lg)}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--s-2);padding:var(--s-1) var(--s-5) var(--s-2);background:var(--c-canvas)}
.key{background:var(--c-surface);border:var(--border) solid var(--c-line-strong);border-bottom-width:3px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:center;padding:0 var(--s-2);line-height:1.15;cursor:pointer;text-align:left}
.key b{font-family:var(--f-num);font-size:var(--t-sm);color:var(--c-accent)}
.key span{font-size:var(--t-sm)}
.key.go{background:var(--c-accent);border-color:var(--c-accent-hover);color:var(--c-on-accent)}
.key.go b{color:var(--c-on-accent)}

/* ---------- dialogs ---------- */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--c-ink) 40%,transparent);display:grid;place-items:center;z-index:20}
.dlg{background:var(--c-surface);border-radius:var(--r-md);box-shadow:var(--elev-dialog);width:min(560px,92%);max-height:92%;overflow:auto;display:grid;gap:var(--s-4);padding:var(--s-5)}
.dlg.wide{width:min(760px,94%)}
.dlg h2{margin:0;font-size:var(--t-xl)}
.dlg .foot{display:flex;justify-content:flex-end;gap:var(--s-2)}
.tender{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s-2)}
.tender button{height:52px;border:var(--border) solid var(--c-line-strong);background:var(--c-surface);border-radius:var(--r-md);cursor:pointer;display:grid;place-items:center;font-weight:var(--w-bold);line-height:1.1}
.tender button small{font-family:var(--f-num);font-size:var(--t-xs);color:var(--c-ink-muted);font-weight:var(--w-regular)}
.tender button.on{border:2px solid var(--c-accent);background:var(--c-select);color:var(--c-accent)}
.bigline{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-lg)}
.bigline b{font-family:var(--f-num);font-size:var(--t-2xl)}
.toast{position:absolute;right:var(--s-5);bottom:calc(var(--status-h) + var(--s-4));z-index:30;max-width:420px}
.toast .banner{box-shadow:var(--elev-dialog)}
.steps{display:flex;gap:var(--s-2);flex-wrap:wrap}
.steps span{padding:4px 10px;border-radius:999px;background:var(--c-surface-alt);font-size:var(--t-sm);color:var(--c-ink-muted)}
.steps span.on{background:var(--c-accent);color:var(--c-on-accent);font-weight:var(--w-bold)}
.steps span.done{background:var(--c-ok-bg);color:var(--c-ok)}
.login{display:grid;grid-template-columns:1.1fr 1fr;height:100%}
.login .art{background:var(--c-accent);color:var(--c-on-accent);padding:var(--s-8);display:grid;align-content:space-between}
.login .art h1{font-size:34px;margin:0;max-width:16ch;line-height:1.15}
.login .form{display:grid;place-items:center;padding:var(--s-8)}
.login .form .panel{width:360px;padding:var(--s-6)}
.prog{height:10px;border-radius:5px;background:var(--c-surface-alt);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c-accent);width:0;transition:width var(--m-base) var(--ease)}
.chk{display:flex;gap:var(--s-2);align-items:center}
.matrix td{text-align:center}
.matrix td:first-child{text-align:left}
.receipt{background:var(--c-surface);border:var(--border) dashed var(--c-line-strong);padding:var(--s-3);font-family:var(--f-num);font-size:var(--t-sm);max-width:300px}
.receipt .ur{direction:rtl;text-align:right;font-family:var(--f-urdu);line-height:1.9}
.receipt .l{display:flex;justify-content:space-between}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--c-ink-muted);font-family:var(--f-num);font-size:10px}
</style>

function lines(){return S.cart.map(function(c){var m=med(c.m);return{m:m,qty:c.qty,src:c.src,amt:Math.round(c.qty*m.rate*100)/100}})}
function totals(){var L=lines(),g=0,u=0;L.forEach(function(l){g+=l.amt;u+=l.qty});var net=Math.max(0,g-S.disc);return{gross:g,units:u,lines:L.length,disc:S.disc,net:net}}
function gs1(s){s=s.replace(/^\]d2/,"").replace(/\u200b/g,"");var o={};if(s.charAt(0)==="("){var re=/\((\d{2})\)([^(]+)/g,m;while((m=re.exec(s)))o[m[1]]=m[2];return o.hasOwnProperty("01")?o:null}
 if(s.slice(0,2)!=="01"||s.length<18)return null;o["01"]=s.slice(2,16);var i=16;while(i<s.length){var ai=s.slice(i,i+2);i+=2;if(ai==="17"||ai==="11"){o[ai]=s.slice(i,i+6);i+=6}else{var j=s.indexOf("|",i);if(j<0)j=s.length;o[ai]=s.slice(i,j);i=j+1}}return o}
function scan(raw){raw=raw.trim();if(!raw)return;var msg=document.getElementById("scanmsg");
 if(/^[*+]\d+$/.test(raw)){var q=parseInt(raw.slice(1),10);if(S.cart[S.sel]){S.cart[S.sel].qty=q;render();say("Quantity set to "+q+".","ok")}return}
 if(S.cart.length>=0&&!S.host){openDlg("hostdown");return}
 var g=gs1(raw),code=g?g["01"].replace(/^0/,""):raw,m=med(code);
 if(!m){say("Barcode "+raw.slice(0,16)+" was not found. Press F2 to search by name, or ask a manager to add the barcode.","danger");return}
 if(m.status==="Inactive"){say(m.name+" is inactive and cannot be sold.","danger");return}
 if(m.days<0){say("Batch "+m.batch+" of "+m.name+" expired 31-Aug-2026. Expired stock cannot be sold. Move it to quarantine.","danger");return}
 for(var i=0;i<S.cart.length;i++){if(S.cart[i].m===m.code){S.cart[i].qty+=1;S.sel=i;render();say("+1 "+m.name+" · batch "+m.batch+(g?" (2D scan)":" (FEFO)"),"ok");return}}
 S.cart.push({m:m.code,qty:1,src:g?"2D":"FEFO"});S.sel=S.cart.length-1;render();say("Added "+m.name+" · batch "+m.batch+" · exp "+m.exp+(g?" · from 2D code":" · earliest expiry picked"),"ok")}

 else if(a==="saveMed"){toast("Medicine saved · price change audited","ok")}
 else if(a==="approveRefund"){toast("Refund above Rs 500: manager PIN requested on this PC","warn")}
 else if(a==="backup"){var b=document.getElementById("bkp"),m=document.getElementById("bkmsg"),w=0;t.disabled=true;var iv=setInterval(function(){w+=20;b.style.width=w+"%";m.textContent=w<100?"Copying… "+w+"% (online backup, counters keep working)":"Verifying…";if(w>=100){clearInterval(iv);setTimeout(function(){m.textContent="Done: medicare-20261014-1943.mcbak · 412 MB · integrity ok · SHA-256 match";t.disabled=false},500)}},300)}
 else if(a==="retry"){S.state="normal";document.getElementById("pState").value="normal";render()}
 else if(a==="openMed"){go("SCR-12")}
 else if(a==="openSup"||a==="openCust"){}
 else if(a==="pickBatch"){}
}
document.addEventListener("keydown",function(e){
 if(SCR[S.screen].pos||SCR[S.screen].bg==="SCR-04"){
  var map={F2:"find",F3:"cust",F4:"pay",F5:"hold",F6:"disc",F7:"batch",F8:"reprint",F9:"ret"};
  if(map[e.key]&&!SCR[S.screen].dialog&&!S.dlg){e.preventDefault();act(map[e.key],e.target);return}
  if(e.key==="Escape"&&(SCR[S.screen].dialog||S.dlg)){e.preventDefault();act("closeDlg",e.target);return}
  if(e.key==="Enter"&&S.screen==="SCR-05"&&e.target.id!=="tend"){var b=document.querySelector('[data-act="complete"]');if(b&&!b.disabled){e.preventDefault();act("complete",b)}}
  if(e.key==="Enter"&&S.screen==="SCR-05"&&e.target.id==="tend"){var c=document.querySelector('[data-act="complete"]');if(c&&!c.disabled){e.preventDefault();act("complete",c)}}
  if(S.screen==="SCR-04"&&!S.dlg&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&S.cart.length){e.preventDefault();S.sel=Math.max(0,Math.min(S.cart.length-1,S.sel+(e.key==="ArrowDown"?1:-1)));render()}
  if(S.screen==="SCR-04"&&e.key==="Delete"&&!S.dlg){act("del")}
 }});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(SCR[h]&&h!==S.screen){S.dlg=null;S.toast=null;S.screen=h;sel.value=h;render()}});
sel.addEventListener("change",function(){go(sel.value)});
document.getElementById("pRole").addEventListener("change",function(){S.role=this.value;render()});
document.getElementById("pState").addEventListener("change",function(){S.state=this.value;if(S.screen==="SCR-04"&&this.value==="normal"&&!S.cart.length)resetCart();render()});
document.getElementById("pHost").addEventListener("click",function(){S.host=!S.host;this.setAttribute("aria-pressed",String(!S.host));render()});
document.getElementById("pDensity").addEventListener("click",function(){var on=document.documentElement.getAttribute("data-density")==="compact";if(on)document.documentElement.removeAttribute("data-density");else document.documentElement.setAttribute("data-density","compact");this.setAttribute("aria-pressed",String(!on))});
document.getElementById("pTheme").addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",d?"light":"dark");this.setAttribute("aria-pressed",String(!d))});
var start=location.hash.slice(1);if(SCR[start])S.screen=start;sel.value=S.screen;render();
})();
</script>
